name: Build Windows executables

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group build

      - name: Build tool2.exe
        run: >
          uv run pyinstaller --onefile --console --name tool2
          --add-data "src/db/freetds.conf;src/db"
          --collect-all pymssql
          run_tool2.py

      - name: Build bench_local_whisper.exe
        run: >
          uv run pyinstaller --onefile --console --name bench_local_whisper
          --add-data "src/db/freetds.conf;src/db"
          --collect-all pymssql
          --collect-all faster_whisper
          --collect-all ctranslate2
          run_bench_local_whisper.py

      - name: Publish exes to a GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build \
            dist/tool2.exe dist/bench_local_whisper.exe \
            --title "Latest build" \
            --notes "Automated build from commit ${{ github.sha }}" \
            --target ${{ github.sha }}
